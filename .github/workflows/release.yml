name: Release BTV

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing config (Optional)
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -n "$SIGNING_PROPERTIES" ] && [ -n "$SIGN_KEY" ]; then
            echo "Applying custom release signing configuration..."
            echo "$SIGNING_PROPERTIES" | base64 -d > signing.properties
            echo "$SIGN_KEY" | base64 -d > key.jks
          else
            echo "No signing secrets found. Falling back to default debug keystore."
          fi

      - name: Build release APK
        env:
          BTV_VERSION_BASE: ${{ github.ref_name }}
        run: |
          export BTV_VERSION_BASE="${BTV_VERSION_BASE#v}"
          ./gradlew assembleRelease --stacktrace

      - name: Parse version and find APK
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_info.outputs.apk_name }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_info.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: BTV ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
