name: Release BTV

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate and decode release signing secrets
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -z "$SIGNING_PROPERTIES" ] || [ -z "$SIGN_KEY" ]; then
            echo "::error::Release build requires SIGNING_PROPERTIES and SIGN_KEY secrets to be configured."
            echo "Missing signing secrets will break OTA update certificate continuity."
            exit 1
          fi
          echo "Applying release signing configuration..."
          echo "$SIGNING_PROPERTIES" | base64 -d > signing.properties
          echo "$SIGN_KEY" | base64 -d > key.jks

      - name: Build release APK
        env:
          BTV_VERSION_BASE: ${{ github.ref_name }}
        run: |
          export BTV_VERSION_BASE="${BTV_VERSION_BASE#v}"
          ./gradlew assembleRelease --stacktrace

      - name: Parse version and find APK
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          APK_NAME=$(basename "$APK_PATH")
          VERSION_CODE=$(echo "$APK_NAME" | cut -d'_' -f2)
          if [ "$VERSION_CODE" = "1" ]; then
            echo "::error::Invalid versionCode=1 detected in release APK $APK_NAME. Check git history or specify BTV_VERSION_CODE."
            exit 1
          fi
          # 拦截与上一已发布版本相比的 versionCode 回退，防止破坏 OTA 覆盖升级
          LATEST_ASSET=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/latest" | \
            jq -r '.assets[]?.name | select(endswith(".apk"))' | head -n 1 || true)
          if [ -n "$LATEST_ASSET" ] && [ "$LATEST_ASSET" != "null" ]; then
            LATEST_CODE=$(echo "$LATEST_ASSET" | cut -d'_' -f2)
            if [ -n "$LATEST_CODE" ] && [ "$LATEST_CODE" -eq "$LATEST_CODE" ] 2>/dev/null; then
              echo "Published latest release versionCode: $LATEST_CODE"
              if [ "$VERSION_CODE" -le "$LATEST_CODE" ]; then
                echo "::error::Release versionCode ($VERSION_CODE) <= published versionCode ($LATEST_CODE). Upgrades would be rejected with INSTALL_FAILED_VERSION_DOWNGRADE."
                exit 1
              fi
            fi
          fi
          echo "Validated release versionCode: $VERSION_CODE"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify release APK signature
        run: |
          APK_PATH="${{ steps.apk_info.outputs.apk_path }}"
          echo "Verifying signing certificate for $APK_PATH..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          echo "Release certificate fingerprints:"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_info.outputs.apk_name }}
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_info.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: BTV ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
